name: JOSS paper preview

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-paper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build JOSS paper
        run: |
          docker pull openjournals/inara
          docker run --rm \
            -v ${{ github.workspace }}:/data \
            -w /data/paper \
            openjournals/inara

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper-pdf
          path: paper/paper.pdf
