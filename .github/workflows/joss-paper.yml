name: Compile JOSS Paper

on:
  push:
    paths:
      - paper/**
      - .github/workflows/joss-paper.yml
  pull_request:
    paths:
      - paper/**
      - .github/workflows/joss-paper.yml

permissions:
  contents: read
  actions: write

jobs:
  compile-paper:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - uses: actions/checkout@v4

      # 2️⃣ Construir PDF usando la acción oficial draft
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@v1
        with:
          journal: joss
          paper-path: paper/paper.md

      # 3️⃣ Subir PDF como artefacto
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper-pdf
          path: paper.pdf
