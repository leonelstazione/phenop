name: JOSS paper preview

on:
  push:
    paths:
      - paper/**
  pull_request:
    paths:
      - paper/**

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configurar R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.1.1"
          use-public-rspm: true

      # 3️⃣ Instalar dependencias necesarias
      - name: Install dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck"))

      # 4️⃣ Construir el paper para JOSS
      - name: Build JOSS paper
        uses: openjournals/openjournals-docker-action@v1
        with:
          journal: joss
