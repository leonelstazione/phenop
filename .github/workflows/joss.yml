name: JOSS paper preview

on:
  push:
    paths:
      - paper/**
  pull_request:
    paths:
      - paper/**

jobs:
  paper:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - uses: actions/checkout@v4

      # 2️⃣ Instalar R (versión estable, con setup-r)
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3' # última estable, con binarios disponibles

      # 3️⃣ Instalar paquetes necesarios con binarios
      - name: Install R packages
        run: |
          install.packages(c(
            "remotes", "rcmdcheck"
          ), repos="https://cloud.r-project.org", dependencies=TRUE)

      # 4️⃣ Ejecutar la acción oficial de JOSS
      - name: Build JOSS paper
        uses: openjournals/openjournals-docker-action@v1
        with:
          journal: joss
