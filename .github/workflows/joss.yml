name: JOSS paper preview

on:
  push:
    paths:
      - paper/**
  pull_request:
    paths:
      - paper/**

jobs:
  paper:
    runs-on: ubuntu-latest
    container:
      image: rocker/r-ver:4.2.3   # Imagen con R preinstalado
    steps:
      # 1️⃣ Clonar el repositorio
      - uses: actions/checkout@v4

      # 2️⃣ Configurar cache para paquetes R
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ runner.os }}-R-lib
          key: ${{ runner.os }}-R-${{ hashFiles('paper/**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-R-

      # 3️⃣ Instalar paquetes R necesarios
      - name: Install R packages
        run: |
          install.packages(c("remotes", "rcmdcheck"),
                           repos = "https://cloud.r-project.org",
                           lib = "${{ runner.os }}-R-lib",
                           type = "binary")

      # 4️⃣ Construir paper con OpenJOSS
      - name: Build JOSS paper
        uses: openjournals/openjournals-docker-action@v1
        with:
          journal: joss
