name: JOSS paper preview

on:
  push:
    paths:
      - paper/**
  pull_request:
    paths:
      - paper/**

jobs:
  paper:
    runs-on: ubuntu-latest  # puedes cambiar a windows-latest o macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2   # <--- v2 obligatoria
        with:
          r-version: "4.1.1"
          use-public-rspm: true

      - name: Install dependencies
        run: |
          install.packages(c("remotes","rcmdcheck"))

      - name: Build JOSS paper
        uses: openjournals/openjournals-docker-action@v1
        with:
          journal: joss
