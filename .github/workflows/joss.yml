name: JOSS paper preview

on:
  push:
    paths:
      - paper/**
  pull_request:
    paths:
      - paper/**

jobs:
  paper:
    runs-on: ubuntu-latest  # Cambialo a windows-latest o macos-latest si querés
    steps:
      # 1. Clonar el repositorio
      - uses: actions/checkout@v4

      # 2. Configurar R moderno (v2 del action)
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.1.1"
          use-public-rspm: true   # RSPM acelera la instalación de paquetes

      # 3. Instalar dependencias necesarias para compilar el paper
      - name: Install R packages
        run: |
          install.packages(c("remotes", "rcmdcheck"))

      # 4. Construir paper para JOSS
      - name: Build JOSS paper
        uses: openjournals/openjournals-docker-action@v1
        with:
          journal: joss
