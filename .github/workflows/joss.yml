name: JOSS paper preview

on:
  push:
    paths:
      - paper/**
  pull_request:
    paths:
      - paper/**

jobs:
  paper:
    runs-on: windows-latest

    steps:
      # 1️⃣ Clonar repo
      - uses: actions/checkout@v4

      # 2️⃣ Instalar R con Chocolatey
      - name: Install R
        run: choco install r.project -y
        shell: powershell

      # 3️⃣ Instalar paquetes necesarios
      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('remotes','rcmdcheck'), repos='https://cloud.r-project.org')"

      # 4️⃣ Construir JOSS paper
      - name: Build JOSS paper
        uses: openjournals/openjournals-docker-action@v1
        with:
          journal: joss
